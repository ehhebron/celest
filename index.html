<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a16" />
    <meta name="description" content="Celest — a precise, beautiful natal chart you can explore, time-travel and share." />
    <title>Celest</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors src/state/theme.ts.
      ;(function () {
        var pref = null
        try { pref = localStorage.getItem('celest:theme') } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3eee3')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
